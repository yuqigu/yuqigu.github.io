<title id="fig1c-t">What discrete causal representation learning identifies</title>
<desc id="fig1c-d">Four latent variables with a directed graph among them, each with three measurements. A checklist states that the measurement graph, the latent distribution and measurement parameters, and the latent causal graph up to Markov equivalence are identified.</desc>
