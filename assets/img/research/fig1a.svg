<title id="fig1a-t">Dependence can supply identifying information</title>
<desc id="fig1a-d">Three small latent-variable graphs. Two latent variables with two measurements each and no dependence: not identifiable. The same design with dependence between the latent variables: identifiable. Three measurements each without dependence: identifiable.</desc>
