<title id="fig1b-t">Identifiable deep architectures can have shared children</title>
<desc id="fig1b-d">An illustrative multilayer graph with two latent layers above an observed layer, with dots marking nodes and edges not drawn. Each drawn parent has children of its own, and some highlighted children have two parents. Layers narrow toward the top.</desc>
<text x="0" y="19" font-size="17" font-weight="700" fill="#14304a" class="f-ink">Depth</text>
<text x="0" y="40" font-size="14" font-weight="400" fill="#4f6275" class="f-muted">Shrinking layers; shared children allowed</text>
