<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 344" width="420" height="344" role="img" aria-labelledby="fig3d-t fig3d-d" font-family="Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif" class="rf">
<title id="fig3d-t">Reasoning length improves held-out prediction on mathematics questions</title>
<desc id="fig3d-d">Dot plot of mean absolute error on held-out questions for five folds and their average. LaRT, which uses answers and reasoning length, has lower error than standard item response theory in every fold. Average error falls from 0.269 to 0.183. Values: fold 1 0.391 and 0.235; fold 2 0.190 and 0.177; fold 3 0.268 and 0.183; fold 4 0.257 and 0.160; fold 5 0.238 and 0.161.</desc>
<text x="0" y="19" font-size="19" font-weight="700" fill="#14304a" class="f-ink">What the process signal adds</text>
<text x="0" y="40" font-size="15" font-weight="400" fill="#4f6275" class="f-muted">Held-out prediction, LLM mathematics questions</text>
