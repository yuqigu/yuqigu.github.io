<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 344" width="420" height="344" role="img" aria-labelledby="fig3c-t fig3c-d" font-family="Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif" class="rf">
<title id="fig3c-t">LaRT's measurement model for language models</title>
<desc id="fig3c-d">Correlated ability and speed traits for each language model. Ability generates whether each answer is correct and speed generates the reasoning length, across benchmark questions.</desc>
<text x="0" y="19" font-size="19" font-weight="700" fill="#14304a" class="f-ink">Two signals, linked traits</text>
<text x="0" y="40" font-size="15" font-weight="400" fill="#4f6275" class="f-muted">Latency-Response Theory for LLMs</text>
<g id="fig3c-question-plate">
<rect x="8" y="170" width="404" height="84" rx="6" fill="#e1f1f2" class="f-teal-soft"/>
<text x="210" y="240" font-size="14.5" font-weight="500" fill="#14304a" class="f-ink" text-anchor="middle">for each benchmark question</text>
</g>
<g id="fig3c-model">
