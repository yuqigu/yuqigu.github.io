<text x="210" y="80" font-size="15" font-weight="500" fill="#a94a07" class="f-orange" text-anchor="middle">correlation <tspan font-style="italic">ρ</tspan></text>
<text x="84" y="205" font-size="15" font-weight="400" fill="#14304a" class="f-ink">answer</text>
<text x="336" y="205" font-size="15" font-weight="400" fill="#14304a" class="f-ink" text-anchor="end">reasoning length</text>
<text x="210" y="290" font-size="15" font-weight="500" fill="#14304a" class="f-ink" text-anchor="middle">Correlation lets reasoning length</text>
