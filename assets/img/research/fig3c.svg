<polygon points="348.32,189.43 341.3,184.12 347.78,180.64" fill="#4f6275" class="f-muted" stroke-linejoin="round"/>
<line x1="124" y1="92" x2="296" y2="92" fill="none" stroke="#a94a07" stroke-width="5" stroke-linecap="butt" class="s-orange"/>
<circle cx="124" cy="92" r="22" fill="#1f5fa8" class="f-blue"/>
<text x="124" y="99.92" font-size="21" font-weight="500" fill="#ffffff" class="f-bg" text-anchor="middle">θ</text>
<circle cx="296" cy="92" r="22" fill="#1f5fa8" class="f-blue"/>
<text x="296" y="99.92" font-size="21" font-weight="500" fill="#ffffff" class="f-bg" text-anchor="middle">τ</text>
<rect x="56.5" y="190.5" width="19" height="19" rx="2" fill="#ffffff" stroke="#14304a" stroke-width="1.9" class="f-bg s-ink"/>
